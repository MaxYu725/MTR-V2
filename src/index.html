<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MTR Aura OS 3.6 Pro - 港鐵極光旗艦版</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060913">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="aurora-mesh"></div>
<div id="aura-toast">✨ MTR Aura OS 已就緒</div>

<div id="aura-shell">
    <!-- Top Header Bar (Minimal & Clear) -->
    <header class="dynamic-island-header">
        <div class="aura-brand">
            <div class="aura-orb-logo">Ж</div>
            <span class="aura-brand-title">MTR AURA</span>
        </div>

        <div class="island-pill" id="dynamic-island-pill" onclick="AuraNav.switchTab(3)">
            <span class="island-dot" id="island-status-dot"></span>
            <span class="island-text" id="island-status-text">全網正常 • 26°C</span>
        </div>

        <div style="display:flex;gap:6px;" id="header-right-tools">
            <button class="header-icon-btn" title="定位最近車站" onclick="AuraDashboard.locateNearest()">📡</button>
            <button class="header-icon-btn" id="aura-theme-btn" title="切換深淺主題" onclick="AuraTheme.toggle()">☀️</button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main id="aura-viewport">
        <!-- VIEW 0: 極光看板 (Clean Dual-PIDS Focus) -->
        <section class="aura-view active" id="view-dashboard">
            <div class="quick-radar-strip">
                <div class="quick-radar-row">
                    <div>
                        <span style="font-size:0.72rem;color:var(--aura-cyan);font-weight:800;">📍 最近車站</span>
                        <div class="quick-nearest-sta" id="hero-nearest-sta">旺角 (約 120m)</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                        <button class="pids-icon-btn" id="hero-btn-origin" onclick="AuraCockpit.setExternal('MOK','origin')" style="color:var(--aura-cyan);border-color:rgba(56,189,248,0.4);">↗ 設為起點</button>
                        <button class="pids-icon-btn" id="hero-btn-holo" onclick="AuraHub.openHologram('MOK')">詳情</button>
                    </div>
                </div>
                <div class="commute-pills-scroll" id="commute-pills-bar"></div>
            </div>

            <div class="bento-section-bar">
                <span class="bento-section-label">📺 實時月台班次看板</span>
                <div style="display:flex;gap:14px;">
                    <span class="bento-action-link" onclick="AuraDashboard.refreshAllBoards(true)">↻ 刷新</span>
                    <span class="bento-action-link" onclick="AuraPicker.open('pin')">＋ 新增車站</span>
                </div>
            </div>

            <div class="pids-bento-list" id="pids-board-container"></div>
        </section>

        <!-- VIEW 1: 路線導航艙 (Map + 3 Distinct Route Options) -->
        <section class="aura-view" id="view-cockpit">
            <div id="aura-map-canvas" class="hide-minor-labels"></div>

            <!-- Top Search & 3-Route Selector Capsule -->
            <div id="cockpit-top-capsule">
                <div class="capsule-inputs-row">
                    <div class="capsule-station-btn active-slot" id="slot-origin" onclick="AuraCockpit.focusSlot('origin')">
                        <div class="capsule-slot-tag">
                            <span>↗ 起點</span>
                            <span style="color:var(--aura-cyan);" onclick="event.stopPropagation();AuraPicker.open('origin')">列表 ▾</span>
                        </div>
                        <div class="capsule-slot-val" id="slot-origin-val">九龍灣</div>
                    </div>

                    <button class="capsule-swap-circle" onclick="AuraCockpit.swapStations()" title="對調起訖站">⇅</button>

                    <div class="capsule-station-btn" id="slot-dest" onclick="AuraCockpit.focusSlot('dest')">
                        <div class="capsule-slot-tag">
                            <span>↘ 終點</span>
                            <span style="color:var(--aura-cyan);" onclick="event.stopPropagation();AuraPicker.open('dest')">列表 ▾</span>
                        </div>
                        <div class="capsule-slot-val" id="slot-dest-val">粉嶺</div>
                    </div>
                </div>

                <!-- 3 Route Alternatives (Shows exact transfer hub!) -->
                <div class="strategy-cards-row" id="strategy-comparison-bar">
                    <div class="strategy-card active" data-mode="fastest" onclick="AuraCockpit.selectStrategy('fastest')">
                        <div class="strategy-title" id="strat-title-fastest">⚡ 最快時間</div>
                        <div class="strategy-sub" id="strat-sub-fastest">--</div>
                    </div>
                    <div class="strategy-card" data-mode="fewest" onclick="AuraCockpit.selectStrategy('fewest')">
                        <div class="strategy-title" id="strat-title-fewest">🔄 最少轉乘</div>
                        <div class="strategy-sub" id="strat-sub-fewest">--</div>
                    </div>
                    <div class="strategy-card" data-mode="comfort" onclick="AuraCockpit.selectStrategy('comfort')">
                        <div class="strategy-title" id="strat-title-comfort">🛋️ 備選路線</div>
                        <div class="strategy-sub" id="strat-sub-comfort">--</div>
                    </div>
                </div>
            </div>

            <!-- Right Map Controls -->
            <div class="cockpit-map-tools">
                <button class="cockpit-tool-btn" onclick="AuraCockpit.zoomIn()">＋</button>
                <button class="cockpit-tool-btn" onclick="AuraCockpit.zoomOut()">－</button>
                <button class="cockpit-tool-btn" onclick="AuraCockpit.resetMap()">🎯</button>
                <button class="cockpit-tool-btn" onclick="AuraCockpit.toggleLabels()">🏷️</button>
            </div>

            <!-- Bottom Navigation Sheet -->
            <div id="cockpit-route-sheet">
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px 14px;">
                    <div style="display:flex;gap:6px;">
                        <button class="pids-icon-btn" onclick="AuraCockpit.setSheetSnap('mini')">看地圖</button>
                        <button class="pids-icon-btn" onclick="AuraCockpit.setSheetSnap('normal')">標準</button>
                        <button class="pids-icon-btn" onclick="AuraCockpit.setSheetSnap('tall')">展開</button>
                    </div>
                    <div style="width:40px;height:4px;background:rgba(148,163,184,0.4);border-radius:2px;cursor:pointer;" onclick="AuraCockpit.cycleSheetSnap()"></div>
                    <div style="display:flex;gap:6px;">
                        <button class="pids-icon-btn" style="color:var(--aura-cyan);" id="btn-bookmark-route">⭐ 收藏</button>
                        <button class="pids-icon-btn" onclick="AuraCockpit.clearRoute()">✕</button>
                    </div>
                </div>

                <!-- 3 Primary Metrics (First-Glance Focus) -->
                <div class="route-hero-metrics" id="cockpit-hero-metrics"></div>

                <!-- Collapsible Extra Details (All Fares + Train Car Consist) -->
                <div id="cockpit-extra-drawer" style="padding:0 14px;"></div>

                <!-- Clean Step-by-Step Timeline -->
                <div id="cockpit-timeline-list" style="flex:1;overflow-y:auto;padding:8px 14px 12px 14px;"></div>
            </div>
        </section>

        <!-- VIEW 2: 車站全息 (Clean 2-Col Station Grid) -->
        <section class="aura-view" id="view-hub">
            <div style="position:sticky;top:0;z-index:20;background:var(--bg-deep);padding-bottom:8px;">
                <div style="display:flex;align-items:center;background:var(--bento-bg);border:1px solid var(--glass-border);border-radius:14px;padding:9px 12px;gap:8px;margin-bottom:8px;">
                    <span>🔍</span>
                    <input type="text" id="hub-search-input" placeholder="搜尋車站 (如：九龍灣、金鐘、KOB)..." style="background:transparent;border:none;outline:none;color:var(--text-main);width:100%;font-size:0.9rem;" oninput="AuraHub.onSearch(this.value)">
                </div>
                <div id="hub-line-pills" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;"></div>
            </div>
            <div class="hub-bento-grid" id="hub-bento-grid"></div>
        </section>

        <!-- VIEW 3: 全網脈搏 (Clean Line Status Grid) -->
        <section class="aura-view" id="view-pulse">
            <div class="quick-radar-strip" style="margin-bottom:12px;">
                <div class="quick-radar-row">
                    <div>
                        <div style="font-size:0.72rem;color:var(--aura-cyan);font-weight:800;">🌤️ 天文台鐵路天氣</div>
                        <div style="display:flex;align-items:baseline;gap:8px;margin-top:2px;">
                            <span style="font-size:1.75rem;font-weight:900;" id="pulse-temp-val">26°C</span>
                            <span style="font-size:0.78rem;color:var(--text-sub);" id="pulse-weather-desc">全網鐵路及露天段正常</span>
                        </div>
                    </div>
                    <button class="pids-icon-btn" id="btn-drill-toggle" style="background:rgba(244,63,94,0.18);color:#F43F5E;border-color:rgba(244,63,94,0.4);" onclick="AuraPulse.toggleDrill()">🚨 事故演練</button>
                </div>
            </div>

            <div class="bento-section-bar">
                <span class="bento-section-label">⚡ 各路綫實時狀態 (點擊查看應變巴士)</span>
                <span class="bento-action-link" onclick="AuraPulse.refresh(true)">↻ 刷新</span>
            </div>
            <div class="pulse-lines-grid" id="pulse-lines-grid"></div>
        </section>
    </main>

    <!-- Bottom Dock -->
    <nav id="aura-spatial-dock">
        <div class="dock-item active" data-tab="0" onclick="AuraNav.switchTab(0)">
            <span class="dock-icon">✨</span>
            <span class="dock-label">極光看板</span>
        </div>
        <div class="dock-item" data-tab="1" onclick="AuraNav.switchTab(1)">
            <span class="dock-icon">🧭</span>
            <span class="dock-label">路線導航</span>
        </div>
        <div class="dock-item" data-tab="2" onclick="AuraNav.switchTab(2)">
            <span class="dock-icon">🏢</span>
            <span class="dock-label">車站全息</span>
        </div>
        <div class="dock-item" data-tab="3" onclick="AuraNav.switchTab(3)">
            <span class="dock-icon">⚡</span>
            <span class="dock-label">全網脈搏</span>
        </div>
    </nav>
</div>

<!-- Centered Modal 1: 車站全息艙 (Centered Spatial Card - No Top Blank Void!) -->
<div class="aura-modal-backdrop hidden" id="hologram-modal" onclick="if(event.target===this)AuraHub.closeHologram()">
    <div class="aura-modal-sheet" id="hologram-sheet-content"></div>
</div>

<!-- Centered Modal 2: 快速選站器 -->
<div class="aura-modal-backdrop hidden" id="matrix-picker-modal" onclick="if(event.target===this)AuraPicker.close()">
    <div class="aura-modal-sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:1.05rem;font-weight:900;" id="matrix-picker-title">選擇車站</span>
            <button class="pids-icon-btn" onclick="AuraPicker.close()">✕ 關閉</button>
        </div>
        <div style="display:flex;align-items:center;background:var(--bento-bg);border:1px solid var(--glass-border);border-radius:12px;padding:8px 12px;gap:8px;margin-bottom:8px;">
            <span>🔍</span>
            <input type="text" id="matrix-picker-input" placeholder="輸入站名快速篩選..." style="background:transparent;border:none;outline:none;color:var(--text-main);width:100%;font-size:0.88rem;" oninput="AuraPicker.renderStations(this.value)">
        </div>
        <div id="matrix-picker-lines" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;flex-shrink:0;"></div>
        <div id="matrix-picker-grid" style="flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
    </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
