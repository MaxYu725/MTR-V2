      - name: Deploy MTR Aura OS 3.0 Pro & Push to MTR-V2
        run: |
          git clone https://github.com/MaxYu725/MTRMetroApp.git /tmp/v1 || true
          mkdir -p src/css src/js custom_icons
          if [ ! -f "src/mtr_fares.json" ] && [ -f "/tmp/v1/src/mtr_fares.json" ]; then
            cp -f /tmp/v1/src/mtr_fares.json src/mtr_fares.json
          fi
          if [ -d "/tmp/v1/custom_icons" ]; then
            cp -rf /tmp/v1/custom_icons/* custom_icons/ || true
          fi
          rm -rf src/pages src/js/v2_enhance.js
          python3 - << 'PYEOF'
          import base64, lzma, io, tarfile
          from pathlib import Path
          raw_b64 = Path("/tmp/aura_os_bundle.b64").read_text()
          clean_b64 = "".join(raw_b64.split())
          raw_tar = lzma.decompress(base64.b64decode(clean_b64))
          with tarfile.open(fileobj=io.BytesIO(raw_tar), mode="r") as tf:
              tf.extractall(".")
          print("Successfully deployed MTR Aura OS 3.0 Pro flagship files!")
          PYEOF
          rm -f /tmp/aura_os_bundle.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Upgrade to MTR Aura OS 3.0 Pro Flagship UI" && git push) || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize Capacitor Android (Offline Self-Contained APK)
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          python3 - << 'PYEOF'
          import json
          cfg = {
              "appId": "com.maxyu.mtreta.v2",
              "appName": "MTR Aura 3.0",
              "webDir": "src",
              "bundledWebRuntime": False
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cfg, f, indent=2)
          PYEOF
          npx cap add android
          npx cap copy android

      - name: Configure Android Permissions & Icons
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              p1 = '<uses-permission android:name="android.permission.VIBRATE" />'
              p2 = '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
              p3 = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
              if "VIBRATE" not in txt:
                  target = '<uses-permission android:name="android.permission.INTERNET" />'
                  txt = txt.replace(target, target + " " + p1 + " " + p2 + " " + p3)
                  manifest.write_text(txt, encoding="utf-8")

          gradle_file = Path("android/app/build.gradle")
          if gradle_file.exists():
              gtxt = gradle_file.read_text(encoding="utf-8")
              fix = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          '''
              if "kotlin-stdlib-jdk7" not in gtxt:
                  gradle_file.write_text(gtxt + "\n" + fix, encoding="utf-8")
          PYEOF
          if [ -d "custom_icons" ]; then
            cp -rf custom_icons/* android/app/src/main/res/ || true
          fi

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTR_Aura_OS_3_Pro_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
