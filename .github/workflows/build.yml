<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTR Aura OS 3.7 Pro - 極光流體動效版</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
/* =========================================================
   MTR AURA OS 3.7 PRO — SPATIAL GLASS + RICH FLUID MOTION
   ========================================================= */
:root {
    --bg-base: #060B17;
    --bg-elevated: rgba(15, 23, 42, 0.72);
    --bg-card: rgba(17, 25, 46, 0.76);
    --bg-card-solid: #10192E;
    --glass-border: rgba(148, 163, 184, 0.16);
    --glass-highlight: rgba(255, 255, 255, 0.08);
    --text-main: #F8FAFC;
    --text-sub: #94A3B8;
    --aura-cyan: #38BDF8;
    --aura-blue: #3B82F6;
    --aura-indigo: #6366F1;
    --aura-emerald: #10B981;
    --aura-amber: #FBBF24;
    --aura-rose: #F43F5E;
    --chip-inactive-bg: rgba(255, 255, 255, 0.06);
    --dock-bg: rgba(11, 18, 34, 0.86);
    --shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.45);
}

body.light-theme {
    --bg-base: #F1F5F9;
    --bg-elevated: rgba(255, 255, 255, 0.86);
    --bg-card: rgba(255, 255, 255, 0.88);
    --bg-card-solid: #FFFFFF;
    --glass-border: rgba(15, 23, 42, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.9);
    --text-main: #0F172A;
    --text-sub: #475569;
    --chip-inactive-bg: rgba(15, 23, 42, 0.06);
    --dock-bg: rgba(255, 255, 255, 0.92);
    --shadow-soft: 0 10px 28px rgba(15, 23, 42, 0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang HK', 'Noto Sans TC', sans-serif;
    background: var(--bg-base);
    color: var(--text-main);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

.hidden { display: none !important; }

/* Ambient Living Aurora Mesh */
#aurora-mesh {
    position: fixed;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.22), transparent 44%),
        radial-gradient(circle at 82% 24%, rgba(99, 102, 241, 0.24), transparent 46%),
        radial-gradient(circle at 52% 84%, rgba(16, 185, 129, 0.16), transparent 48%);
    filter: blur(36px);
    animation: auroraDrift 16s ease-in-out infinite;
    will-change: transform, opacity;
}
body.light-theme #aurora-mesh {
    background:
        radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.18), transparent 45%),
        radial-gradient(circle at 82% 24%, rgba(99, 102, 241, 0.15), transparent 45%),
        radial-gradient(circle at 52% 84%, rgba(16, 185, 129, 0.14), transparent 48%);
}

@keyframes auroraDrift {
    0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 0.9; }
    33%  { transform: translate3d(2.5%, -2%, 0) scale(1.06); opacity: 1; }
    66%  { transform: translate3d(-2%, 2.5%, 0) scale(1.03); opacity: 0.85; }
    100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.9; }
}

/* App Shell */
#aura-app-shell {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 560px;
    margin: 0 auto;
}

/* Top Spatial Header */
#aura-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px 10px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    z-index: 20;
}
.aura-brand-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; }
.aura-orb-logo {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(135deg, #FF2E4C, #7928CA, #00D2FF);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.95rem; color: #fff; flex-shrink: 0;
    animation: orbBreathe 3.2s ease-in-out infinite;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
}
.aura-orb-logo:active { transform: scale(0.86) rotate(-12deg); }
@keyframes orbBreathe {
    0%, 100% { box-shadow: 0 4px 14px rgba(255, 46, 76, 0.35), 0 0 0 0 rgba(0, 210, 255, 0.35); }
    50%      { box-shadow: 0 4px 20px rgba(121, 40, 202, 0.55), 0 0 0 5px rgba(0, 210, 255, 0); }
}
.aura-title-txt { font-size: 0.88rem; font-weight: 900; letter-spacing: 0.03em; line-height: 1.1; }
.aura-clock-txt { font-size: 0.68rem; color: var(--text-sub); font-variant-numeric: tabular-nums; margin-top: 2px; }

/* Dynamic Island Status Pill */
.island-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px;
    background: var(--bg-card); border: 1px solid var(--glass-border);
    font-size: 0.72rem; font-weight: 700; cursor: pointer;
    white-space: nowrap; transition: all 0.25s ease;
}
.island-pill.alert { border-color: rgba(244, 63, 94, 0.55); background: rgba(244, 63, 94, 0.14); color: #FDA4AF; }
body.light-theme .island-pill.alert { color: #BE123C; }
.island-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--aura-emerald); flex-shrink: 0;
    animation: statusBeacon 2.2s infinite;
}
.island-pill.alert .island-dot { background: var(--aura-rose); animation: statusAlertBeacon 1.3s infinite; }
@keyframes statusBeacon {
    0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70%  { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
@keyframes statusAlertBeacon {
    0%   { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.8); }
    70%  { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
}

.header-icon-btn {
    height: 34px; min-width: 34px; padding: 0 9px;
    border-radius: 11px; border: 1px solid var(--glass-border);
    background: var(--bg-card); color: var(--text-main);
    font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* Main View Container & Spatial Crossfade */
#aura-views-host {
    position: relative;
    flex: 1;
    overflow: hidden;
}
.aura-view {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 4px 14px 96px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(14px) scale(0.985);
    transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    scrollbar-width: none;
}
.aura-view::-webkit-scrollbar { display: none; }
.aura-view.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

/* Staggered Card Cascade Reveal */
@keyframes cardCascadeIn {
    0%   { opacity: 0; transform: translateY(18px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
.anim-stagger {
    opacity: 0;
    animation: cardCascadeIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    animation-delay: calc(var(--i, 0) * 45ms);
}

/* Tactile Spring Press on Interactive Elements */
.pids-icon-btn, .header-icon-btn, .commute-pill, .hub-station-card, .pulse-line-bento, .strategy-card, .cockpit-tool-btn, .capsule-station-btn {
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.pids-icon-btn:active, .header-icon-btn:active, .commute-pill:active, .hub-station-card:active, .pulse-line-bento:active, .strategy-card:active, .cockpit-tool-btn:active, .capsule-station-btn:active {
    transform: scale(0.94);
}

/* Section Header Row */
.bento-sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 12px 2px 8px;
}
.bento-sec-title { font-size: 0.78rem; font-weight: 800; color: var(--text-sub); letter-spacing: 0.04em; text-transform: uppercase; }
.bento-action-link { font-size: 0.75rem; font-weight: 700; color: var(--aura-cyan); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

/* Quick GPS Radar Strip */
.quick-radar-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-radius: 18px;
    background: var(--bg-card); border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px); margin-bottom: 12px;
    box-shadow: var(--shadow-soft);
}
@keyframes radarScanGlow {
    0%   { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55); }
    100% { box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
}
.radar-scanning {
    animation: radarScanGlow 0.9s ease-out 2;
    border-color: var(--aura-cyan) !important;
}

/* Commute Preset Pills */
.commute-pills-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px;
    scrollbar-width: none;
}
.commute-pills-row::-webkit-scrollbar { display: none; }
.commute-pill {
    flex-shrink: 0; padding: 7px 12px; border-radius: 999px;
    background: var(--bg-card); border: 1px solid var(--glass-border);
    color: var(--text-main); font-size: 0.76rem; font-weight: 700; cursor: pointer;
}

/* Dual-Platform PIDS Station Card */
.pids-station-card {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 13px 14px;
    margin-bottom: 12px;
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow-soft);
}
.pids-card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
}
.pids-line-bar { width: 4px; height: 22px; border-radius: 4px; flex-shrink: 0; }
.pids-sta-name { font-size: 1.02rem; font-weight: 900; }
.pids-line-tag { font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; color: #fff; }
.pids-icon-btn {
    padding: 5px 9px; border-radius: 10px;
    background: var(--chip-inactive-bg); border: 1px solid var(--glass-border);
    color: var(--text-main); font-size: 0.72rem; font-weight: 700; cursor: pointer;
}
.pids-dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.pids-pane {
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 10px 11px;
}
body.light-theme .pids-pane { background: rgba(15, 23, 42, 0.035); }
.pids-dir-label { font-size: 0.7rem; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pids-eta-row { display: flex; align-items: baseline; gap: 4px; }
.pids-eta-num { font-size: 1.55rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--aura-cyan); }
.pids-eta-num.arriving { font-size: 1.1rem; color: var(--aura-amber); animation: arrivingPulse 1.3s ease-in-out infinite; }
.pids-eta-num.terminus { font-size: 0.95rem; color: var(--text-sub); }
.pids-eta-unit { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); }
.pids-sub-eta { font-size: 0.68rem; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Live Train Track Progress Bar inside PIDS Panes */
.pids-rail-track {
    position: relative;
    height: 4px;
    background: rgba(255, 255, 255, 0.09);
    border-radius: 4px;
    margin: 5px 0 7px 0;
    overflow: hidden;
}
body.light-theme .pids-rail-track { background: rgba(15, 23, 42, 0.1); }
.pids-rail-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #10B981, #38BDF8);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
}
.pids-rail-fill.down-fill { background: linear-gradient(90deg, #F472B6, #A855F7); }
.pids-rail-fill::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 18px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85));
    animation: railSpark 1.8s ease-in-out infinite;
}
@keyframes railSpark { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes arrivingPulse {
    0%, 100% { opacity: 1; transform: scale(1); text-shadow: 0 0 12px rgba(251, 191, 36, 0.55); }
    50%      { opacity: 0.72; transform: scale(1.04); text-shadow: 0 0 22px rgba(251, 191, 36, 0.9); }
}
@keyframes etaPopIn {
    0%   { opacity: 0; transform: translateY(6px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
.eta-pop { animation: etaPopIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }

/* Refresh Spin */
@keyframes spin360 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.spinning-icon { animation: spin360 0.65s cubic-bezier(0.22, 1, 0.36, 1); }

/* =========================================================
   VIEW 1: ROUTE COCKPIT
   ========================================================= */
.cockpit-capsule {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 12px;
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow-soft);
    margin-bottom: 10px;
}
.capsule-row { display: flex; align-items: center; gap: 8px; }
.capsule-station-btn {
    flex: 1; min-width: 0; text-align: left;
    padding: 10px 12px; border-radius: 14px;
    background: rgba(0, 0, 0, 0.22); border: 1px solid var(--glass-border);
    color: var(--text-main); cursor: pointer;
}
body.light-theme .capsule-station-btn { background: rgba(15, 23, 42, 0.04); }
.capsule-station-btn.origin { border-color: rgba(56, 189, 248, 0.45); }
.capsule-lbl { font-size: 0.65rem; font-weight: 800; color: var(--text-sub); display: flex; justify-content: space-between; }
.capsule-val { font-size: 0.95rem; font-weight: 900; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capsule-swap-circle {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #3B82F6, #6366F1);
    border: none; color: #fff; font-size: 0.95rem; font-weight: 900;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
}
@keyframes swapRotate180 {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(90deg) scale(1.14); }
    100% { transform: rotate(180deg) scale(1); }
}
.swap-spinning { animation: swapRotate180 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); }

.strategy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 10px; }
.strategy-card {
    padding: 8px 7px; border-radius: 13px; text-align: center;
    background: var(--chip-inactive-bg); border: 1px solid var(--glass-border);
    color: var(--text-main); cursor: pointer;
}
.strategy-card.active {
    background: rgba(56, 189, 248, 0.14);
    border-color: var(--aura-cyan);
    box-shadow: 0 0 14px rgba(56, 189, 248, 0.22);
}
.strat-title { font-size: 0.72rem; font-weight: 800; }
.strat-meta { font-size: 0.66rem; color: var(--text-sub); margin-top: 2px; }
.strat-via { font-size: 0.62rem; color: var(--aura-cyan); font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Interactive Map Container */
#aura-map-wrap {
    position: relative;
    height: 195px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--glass-border);
    margin-bottom: 10px;
    transition: height 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
#aura-map-wrap.expanded { height: 320px; }
#aura-map { width: 100%; height: 100%; background: #0B1221; }
.map-mode-bar {
    position: absolute; top: 8px; right: 8px; z-index: 450;
    display: flex; gap: 5px;
}
.cockpit-tool-btn {
    padding: 5px 9px; border-radius: 10px;
    background: rgba(11, 18, 34, 0.82); border: 1px solid var(--glass-border);
    color: #fff; font-size: 0.68rem; font-weight: 700; cursor: pointer;
    backdrop-filter: blur(8px);
}

/* Map Station Markers + Sonar Ripples */
.mtr-station-marker {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,0,0,0.6);
}
@keyframes mapOriginSonar {
    0%   { box-shadow: 0 0 0 0 rgba(255, 46, 76, 0.75); }
    70%  { box-shadow: 0 0 0 14px rgba(255, 46, 76, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 46, 76, 0); }
}
@keyframes mapDestSonar {
    0%   { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.75); }
    70%  { box-shadow: 0 0 0 14px rgba(0, 240, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
}
.mtr-station-marker.selected-origin {
    background: #FF2E4C !important; width: 16px; height: 16px;
    animation: mapOriginSonar 1.8s infinite;
}
.mtr-station-marker.selected-dest {
    background: #00F0FF !important; width: 16px; height: 16px;
    animation: mapDestSonar 1.8s infinite;
}

/* Route Summary Card (3 Hero Metrics + Collapsible Consist/Fares) */
.route-result-card {
    background: var(--bg-card);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 14px;
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow-soft);
}
.hero-metrics-grid { display: grid; grid-template-columns: 1.25fr 0.9fr 0.85fr; gap: 8px; margin-bottom: 10px; }
.hero-metric-box {
    background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
    border-radius: 13px; padding: 9px 10px;
}
body.light-theme .hero-metric-box { background: rgba(15, 23, 42, 0.035); }
.metric-lbl { font-size: 0.65rem; font-weight: 700; color: var(--text-sub); }
.metric-val { font-size: 1.15rem; font-weight: 900; margin-top: 2px; font-variant-numeric: tabular-nums; }
.metric-sub { font-size: 0.64rem; color: var(--text-sub); margin-top: 2px; }

/* Recommended Train Car Shimmer */
@keyframes carShimmer {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(220%); }
}
.best-car-shimmer { position: relative; overflow: hidden; }
.best-car-shimmer::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 45%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: carShimmer 2.4s ease-in-out infinite;
}

/* Accordion Drawer Reveal */
@keyframes drawerReveal {
    0%   { opacity: 0; transform: translateY(-6px); }
    100% { opacity: 1; transform: translateY(0); }
}
.drawer-anim { animation: drawerReveal 0.28s cubic-bezier(0.22, 1, 0.36, 1); }

/* =========================================================
   VIEW 2: STATION HOLOGRAM HUB
   ========================================================= */
.hub-search-input {
    width: 100%; padding: 11px 14px; border-radius: 14px;
    background: var(--bg-card); border: 1px solid var(--glass-border);
    color: var(--text-main); font-size: 0.86rem; outline: none; margin-bottom: 9px;
}
.hub-search-input:focus { border-color: var(--aura-cyan); }
.hub-line-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.hub-line-chips::-webkit-scrollbar { display: none; }
.hub-chip {
    flex-shrink: 0; padding: 6px 11px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 800; border: 1px solid var(--glass-border);
    background: var(--chip-inactive-bg); color: var(--text-main); cursor: pointer;
}
.hub-chip.active { background: var(--aura-blue); color: #fff; border-color: transparent; }

.hub-bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.hub-station-card {
    background: var(--bg-card); border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 11px 12px; cursor: pointer;
}
.hub-sta-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.hub-sta-zh { font-size: 0.96rem; font-weight: 900; }
.hub-sta-code { font-size: 0.65rem; font-weight: 800; color: var(--text-sub); background: var(--chip-inactive-bg); padding: 2px 6px; border-radius: 6px; }
.hub-sta-en { font-size: 0.68rem; color: var(--text-sub); margin: 2px 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hub-badges-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: space-between; }

/* =========================================================
   VIEW 3: NETWORK PULSE & HKO WEATHER
   ========================================================= */
.weather-bento {
    background: var(--bg-card); border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 14px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: var(--shadow-soft);
}
.pulse-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
.pulse-line-bento {
    background: var(--bg-card); border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 12px 13px; cursor: pointer;
}
@keyframes alertBorderGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.25); }
    50%      { box-shadow: 0 0 16px 2px rgba(244, 63, 94, 0.45); }
}
.pulse-line-bento.delayed {
    border-color: rgba(244, 63, 94, 0.65);
    animation: alertBorderGlow 1.8s ease-in-out infinite;
}
.alt-box {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.35);
    font-size: 0.72rem; line-height: 1.45;
}

/* =========================================================
   LIQUID SLIDING BOTTOM DOCK
   ========================================================= */
#aura-spatial-dock {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 520px;
    height: 60px;
    padding: 6px;
    border-radius: 30px;
    background: var(--dock-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    z-index: 50;
}
#dock-active-pill {
    position: absolute;
    left: 6px;
    top: 7px;
    width: calc((100% - 12px) / 4);
    height: 46px;
    border-radius: 23px;
    background: linear-gradient(135deg, #0EA5E9, #4F46E5);
    box-shadow: 0 4px 18px rgba(14, 165, 233, 0.45);
    transition: transform 0.42s cubic-bezier(0.34, 1.38, 0.64, 1);
    z-index: 0;
    pointer-events: none;
}
.dock-item {
    position: relative;
    z-index: 1;
    height: 46px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer;
    transition: color 0.25s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dock-item.active { background: transparent !important; color: #fff; }
.dock-icon { font-size: 1.05rem; line-height: 1; }
.dock-label { font-size: 0.64rem; font-weight: 800; }
.dock-item.active .dock-icon { animation: dockIconPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes dockIconPop {
    0%   { transform: scale(0.75) translateY(3px); }
    55%  { transform: scale(1.22) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
}

/* =========================================================
   CENTERED SPATIAL MODAL + SPRING ZOOM
   ========================================================= */
.aura-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.aura-modal-sheet {
    width: 100%;
    max-width: 460px;
    max-height: 82vh;
    background: var(--bg-card-solid);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    overflow: hidden;
}
@keyframes backdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalSpringIn {
    0%   { opacity: 0; transform: scale(0.88) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
.aura-modal-backdrop:not(.hidden) { animation: backdropFadeIn 0.22s ease forwards; }
.aura-modal-backdrop:not(.hidden) .aura-modal-sheet { animation: modalSpringIn 0.36s cubic-bezier(0.34, 1.4, 0.64, 1) forwards; }

/* Hologram Inner Tab Slide */
@keyframes tabContentSlide {
    0%   { opacity: 0; transform: translateX(10px); }
    100% { opacity: 1; transform: translateX(0); }
}
.holo-tab-content-anim { animation: tabContentSlide 0.26s cubic-bezier(0.22, 1, 0.36, 1); }

/* Toast */
#aura-toast {
    position: fixed;
    top: 66px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    z-index: 200;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid rgba(56, 189, 248, 0.45);
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
#aura-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>
<div id="aurora-mesh"></div>

<div id="aura-app-shell">
    <!-- Top Spatial Bar -->
    <header id="aura-top-bar">
        <div class="aura-brand-wrap" onclick="AuraNav.switchTab(0)">
            <div class="aura-orb-logo">Ж</div>
            <div>
                <div class="aura-title-txt">MTR AURA OS</div>
                <div class="aura-clock-txt" id="aura-hkt-clock">HKT --:--:--</div>
            </div>
        </div>

        <div class="island-pill" id="aura-island-pill" onclick="AuraNav.switchTab(3)">
            <span class="island-dot"></span>
            <span id="island-status-txt">全網正常 • 24°C</span>
        </div>

        <div style="display:flex;gap:6px;" id="header-right-tools">
            <button class="header-icon-btn" onclick="AuraGithubModal.open()" style="font-size:0.72rem;font-weight:800;color:var(--aura-cyan);border-color:rgba(56,189,248,0.4);">☁️ 工作流</button>
            <button class="header-icon-btn" onclick="AuraDashboard.locateNearest()" title="GPS 定位最近車站">📡</button>
            <button class="header-icon-btn" id="theme-toggle-btn" onclick="AuraTheme.toggle()" title="切換深淺色">☀️</button>
        </div>
    </header>

    <!-- 4 Main Spatial Views -->
    <main id="aura-views-host">
        <!-- VIEW 0: 極光看板 (Live Dual-PIDS Dashboard) -->
        <section id="view-dashboard" class="aura-view active">
            <div class="quick-radar-strip">
                <div style="min-width:0;">
                    <div style="font-size:0.68rem;color:var(--aura-cyan);font-weight:800;">📡 最近港鐵站雷達</div>
                    <div id="radar-nearest-title" style="font-size:0.95rem;font-weight:900;margin-top:2px;">九龍灣站 (KOB)</div>
                    <div id="radar-nearest-sub" style="font-size:0.7rem;color:var(--text-sub);">觀塘綫 • 點擊右側即時定位</div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0;">
                    <button class="pids-icon-btn" onclick="AuraDashboard.locateNearest()">定位</button>
                    <button class="pids-icon-btn" style="background:var(--aura-blue);color:#fff;border:none;" onclick="AuraDashboard.navFromNearest()">出發</button>
                </div>
            </div>

            <div class="commute-pills-row">
                <button class="commute-pill" onclick="AuraCockpit.quickPlan('KOB','FAN')">🏠 九龍灣 ➔ 粉嶺</button>
                <button class="commute-pill" onclick="AuraCockpit.quickPlan('KOB','CEN')">💼 九龍灣 ➔ 中環</button>
                <button class="commute-pill" onclick="AuraCockpit.quickPlan('TAW','CEN')">🌊 大圍 ➔ 中環</button>
                <button class="commute-pill" onclick="AuraCockpit.quickPlan('TSW','CAB')">🛍️ 荃灣 ➔ 銅鑼灣</button>
            </div>

            <div class="bento-sec-head">
                <span class="bento-sec-title">雙月台實時列車看板 (LIVE PIDS)</span>
                <span class="bento-action-link" onclick="AuraDashboard.refreshAllBoards(true)"><span id="dash-refresh-icon" style="display:inline-block;">↻</span> 刷新</span>
            </div>

            <div id="pids-boards-container"></div>
        </section>

        <!-- VIEW 1: 路綫導航艙 (State-Space Dijkstra + Leaflet Map) -->
        <section id="view-cockpit" class="aura-view">
            <div class="cockpit-capsule">
                <div class="capsule-row">
                    <button class="capsule-station-btn origin" onclick="AuraPicker.open('origin')">
                        <div class="capsule-lbl"><span>↗ 起點 ORIGIN</span><span>選站 ▾</span></div>
                        <div class="capsule-val" id="cockpit-origin-txt">九龍灣 (KOB)</div>
                    </button>
                    <button class="capsule-swap-circle" onclick="AuraCockpit.swapStations()" title="對調起終點">⇅</button>
                    <button class="capsule-station-btn" onclick="AuraPicker.open('dest')">
                        <div class="capsule-lbl"><span>↘ 終點 DEST</span><span>選站 ▾</span></div>
                        <div class="capsule-val" id="cockpit-dest-txt">粉嶺 (FAN)</div>
                    </button>
                </div>

                <div class="strategy-grid">
                    <button class="strategy-card active" id="strat-btn-fastest" onclick="AuraCockpit.selectStrategy('fastest')">
                        <div class="strat-title">⚡ 最快時間</div>
                        <div class="strat-meta" id="strat-meta-fastest">-- 分 • -- 轉乘</div>
                        <div class="strat-via" id="strat-via-fastest">計算中...</div>
                    </button>
                    <button class="strategy-card" id="strat-btn-fewest" onclick="AuraCockpit.selectStrategy('fewest')">
                        <div class="strat-title">🔄 最少轉乘</div>
                        <div class="strat-meta" id="strat-meta-fewest">-- 分 • -- 轉乘</div>
                        <div class="strat-via" id="strat-via-fewest">計算中...</div>
                    </button>
                    <button class="strategy-card" id="strat-btn-cross" onclick="AuraCockpit.selectStrategy('cross')">
                        <div class="strat-title">🚇 同月台優先</div>
                        <div class="strat-meta" id="strat-meta-cross">-- 分 • -- 轉乘</div>
                        <div class="strat-via" id="strat-via-cross">計算中...</div>
                    </button>
                </div>
            </div>

            <div id="aura-map-wrap">
                <div id="aura-map"></div>
                <div class="map-mode-bar">
                    <button class="cockpit-tool-btn" id="map-expand-btn" onclick="AuraCockpit.toggleMapSize()">⤢ 放大地圖</button>
                    <button class="cockpit-tool-btn" onclick="AuraCockpit.fitRouteBounds()">🎯 置中路綫</button>
                </div>
            </div>

            <div id="cockpit-result-host"></div>
        </section>

        <!-- VIEW 2: 車站全息 (98-Station Bento Hub) -->
        <section id="view-hub" class="aura-view">
            <input type="text" id="hub-search-box" class="hub-search-input" placeholder="🔍 搜尋 98 個港鐵車站（中 / 英 / 代碼，如 KOB、九龍塘）..." oninput="AuraHub.renderGrid()">
            <div class="hub-line-chips" id="hub-line-chips"></div>
            <div class="hub-bento-grid" id="hub-bento-grid"></div>
        </section>

        <!-- VIEW 3: 全網脈搏 (HKO Weather + 10-Line Status & Drill) -->
        <section id="view-pulse" class="aura-view">
            <div class="weather-bento">
                <div>
                    <div style="font-size:0.68rem;color:var(--aura-cyan);font-weight:800;">🌤️ 香港天文台實時天氣 (HKO)</div>
                    <div id="pulse-weather-main" style="font-size:1.35rem;font-weight:900;margin-top:2px;">24°C • 濕度 74%</div>
                    <div id="pulse-weather-sub" style="font-size:0.72rem;color:var(--text-sub);margin-top:2px;">天文台總部 • 適合鐵路出行</div>
                </div>
                <button class="pids-icon-btn" id="pulse-drill-btn" onclick="AuraPulse.toggleDrill()" style="padding:8px 11px;">🚨 延誤演習</button>
            </div>

            <div class="bento-sec-head">
                <span class="bento-sec-title">全港 10 條重鐵路綫狀態（點擊單綫模擬延誤）</span>
                <span class="bento-action-link" onclick="AuraPulse.refresh(true)"><span id="pulse-refresh-icon" style="display:inline-block;">↻</span> 刷新</span>
            </div>

            <div class="pulse-grid" id="pulse-lines-grid"></div>
        </section>
    </main>

    <!-- Floating Spatial Bottom Dock with Liquid Active Pill -->
    <nav id="aura-spatial-dock">
        <div id="dock-active-pill"></div>
        <button class="dock-item active" onclick="AuraNav.switchTab(0)">
            <span class="dock-icon">✨</span>
            <span class="dock-label">極光看板</span>
        </button>
        <button class="dock-item" onclick="AuraNav.switchTab(1)">
            <span class="dock-icon">🧭</span>
            <span class="dock-label">路綫導航艙</span>
        </button>
        <button class="dock-item" onclick="AuraNav.switchTab(2)">
            <span class="dock-icon">🏢</span>
            <span class="dock-label">車站全息</span>
        </button>
        <button class="dock-item" onclick="AuraNav.switchTab(3)">
            <span class="dock-icon">⚡</span>
            <span class="dock-label">全網脈搏</span>
        </button>
    </nav>
</div>

<!-- Centered Station Hologram Modal -->
<div class="aura-modal-backdrop hidden" id="station-hologram-modal" onclick="if(event.target===this)AuraHub.closeHologram()">
    <div class="aura-modal-sheet" id="hologram-modal-content"></div>
</div>

<!-- Centered Station Picker Modal -->
<div class="aura-modal-backdrop hidden" id="station-picker-modal" onclick="if(event.target===this)AuraPicker.close()">
    <div class="aura-modal-sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div id="picker-modal-title" style="font-size:1rem;font-weight:900;">選擇車站</div>
            <button class="pids-icon-btn" onclick="AuraPicker.close()">✕</button>
        </div>
        <input type="text" id="picker-search-input" class="hub-search-input" placeholder="輸入車站名稱或代碼..." oninput="AuraPicker.renderList()">
        <div id="picker-list-body" style="flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;"></div>
    </div>
</div>

<div id="aura-toast"></div>

