F\n          rm -f /tmp/aura_os_bundle.b64\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"github-actions[bot]@users.noreply.github.com\"\n          git add -A\n          git diff --staged --quiet || (git commit -m \"Upgrade to MTR Aura OS 3.7 Pro (Fluid Motion & Animations)\" && git push) || true\n\n      - name: Set up Node.js 20\n        uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n\n      - name: Set up Java 21\n        uses: actions/setup-java@v4\n        with:\n          java-version: '21'\n          distribution: 'temurin'\n\n      - name: Initialize Capacitor Android (Offline Self-Contained APK)\n        run: |\n          npm init -y\n          npm install @capacitor/core @capacitor/cli @capacitor/android\n          python3 - << 'PYEOF'\n          import json\n          cfg = {\n              \"appId\": \"com.maxyu.mtreta.v2\",\n              \"appName\": \"MTR Aura 3.7\",\n              \"webDir\": \"src\",\n              \"bundledWebRuntime\": False\n          }\n          with open(\"capacitor.config.json\", \"w\") as f:\n              json.dump(cfg, f, indent=2)\n          PYEOF\n          npx cap add android\n          npx cap copy android\n\n      - name: Configure Android Permissions & Icons\n        run: |\n          python3 - << 'PYEOF'\n          from pathlib import Path\n          manifest = Path(\"android/app/src/main/AndroidManifest.xml\")\n          if manifest.exists():\n              txt = manifest.read_text(encoding=\"utf-8\")\n              p1 = '<uses-permission android:name=\"android.permission.VIBRATE\" />'\n              p2 = '<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />'\n              p3 = '<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />'\n              if \"VIBRATE\" not in txt:\n                  target = '<uses-permission android:name=\"android.permission.INTERNET\" />'\n                  txt = txt.replace(target, target + \" \" + p1 + \" \" + p2 + \" \" + p3)\n                  manifest.write_text(txt, encoding=\"utf-8\")\n\n          gradle_file = Path(\"android/app/build.gradle\")\n          if gradle_file.exists():\n              gtxt = gradle_file.read_text(encoding=\"utf-8\")\n              fix = '''\n          configurations.all {\n              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n          }\n          '''\n              if \"kotlin-stdlib-jdk7\" not in gtxt:\n                  gradle_file.write_text(gtxt + \"\\n\" + fix, encoding=\"utf-8\")\n          PYEOF\n          if [ -d \"custom_icons\" ]; then\n            cp -rf custom_icons/* android/app/src/main/res/ || true\n          fi\n\n      - name: Build Debug APK via Gradle\n        run: |\n          cd android\n          chmod +x gradlew\n          ./gradlew assembleDebug\n\n      - name: Upload Ready-to-Install APK Artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: MTR_Aura_OS_3_Pro_APK\n          path: android/app/build/outputs/apk/debug/app-debug.apk\n",
    open() {
        const modal = document.getElementById('github-yml-modal');
        const ta = document.getElementById('github-yml-textarea');
        if (ta && !ta.value) ta.value = this.rawYml;
        if (modal) modal.classList.remove('hidden');
    },
    close() {
        const modal = document.getElementById('github-yml-modal');
        if (modal) modal.classList.add('hidden');
    },
    copyYml() {
        const ta = document.getElementById('github-yml-textarea');
        if (ta) { ta.value = this.rawYml; ta.select(); ta.setSelectionRange(0, 999999); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(this.rawYml).then(() => AuraToast.show('✅ 已複製 v3.7 build.yml！'));
        } else {
            document.execCommand('copy');
            AuraToast.show('✅ 已複製 v3.7 build.yml！');
        }
    },
    downloadYml() {
        const blob = new Blob([this.rawYml], { type: 'text/yaml;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'build.yml';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
};
</script>

